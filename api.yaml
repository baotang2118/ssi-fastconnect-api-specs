openapi: 3.1.0
info:
  title: "FastConnect API"
  version: "3.2.0"
servers:
  - url: "https://api.ssi.com.vn"
paths:
  /api/v3/auth/token:
    post:
      tags:
        - Authentication
      operationId: ""
      summary: "auth-token"
      description: "Xác thực apiKey/apiSecret để lấy access token và refresh token (kèm thông tin hết hạn)."
      parameters: []
      requestBody:
        description: ""
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apiKey
                - apiSecret
              properties:
                apiKey:
                  type: string
                  description: "API key do SSI/FastConnect cấp cho ứng dụng."
                apiSecret:
                  type: string
                  description: "API secret tương ứng với `apiKey`."
                otp:
                  type:
                    - string
                    - "null"
                  description: "Mã OTP (SMS OTP hoặc SmartOTP) cần phải có nếu bạn muốn token cấp ra có quyền thực hiện giao dịch. Trường hợp chỉ sử dụng để truy vấn dữ liệu (data, query trading) thì không cần truyền OTP."
                transactionId:
                  type:
                    - string
                    - "null"
                  description: "Mã transaction trả về từ API `auth/requestOtp` khi tài khoản dùng 2FA loại SmartOTP và đã kích hoạt luồng phê duyệt qua ứng dụng iBoard."
      responses:
        "200":
          description: "Thành công."
          headers:
            X-RATELIMIT-LIMIT:
              description: "Giới hạn số request trong chu kỳ."
              required: false
              schema:
                type: string
            X-RATELIMIT-REMAINING:
              description: "Số request còn lại trong chu kỳ hiện tại."
              required: false
              schema:
                type: string
            X-RATELIMIT-RESET:
              description: "Thời điểm reset giới hạn request."
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: []
                properties:
                  tokenType:
                    type: string
                    description: "Loại token dùng trong header Authorization."
                  accessToken:
                    type: string
                    description: "Access token dùng để gọi các API nghiệp vụ."
                  expiresAt:
                    type: integer
                    description: "Thời điểm hết hạn của access token theo timestamp (epoch milliseconds)."
                  refreshToken:
                    type: string
                    description: "Refresh token dùng để xin access token mới khi hết hạn."
                  refreshExpiresAt:
                    type: integer
                    description: "Thời điểm hết hạn của refresh token theo timestamp (epoch milliseconds)."
        "400":
          description: "Request không hợp lệ."
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required: []
                properties:
                  code:
                    type: integer
                    description: "Mã lỗi."
                  msg:
                    type: string
                    description: "Chi tiết lỗi để hỗ trợ xử lý phía client."
  /api/v3/auth/requestOtp:
    post:
      tags:
        - Authentication
      operationId: ""
      summary: "auth-requestOtp"
      description: "Gửi yêu cầu OTP phục vụ xác thực giao dịch. Với tài khoản 2FA loại SMS/Email, OTP sẽ được gửi về email/số điện thoại đã đăng ký. Với tài khoản 2FA loại SmartOTP, khách hàng nhận yêu cầu phê duyệt trên ứng dụng iBoard và có thể dùng `transactionId` trả về để gọi `auth/token`."
      parameters: []
      requestBody:
        description: ""
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apiKey
                - apiSecret
              properties:
                apiKey:
                  type: string
                  description: "API key do SSI/FastConnect cấp."
                apiSecret:
                  type: string
                  description: "API secret tương ứng với `apiKey`."
      responses:
        "200":
          description: "Thành công."
          headers:
            X-RATELIMIT-LIMIT:
              description: "Giới hạn số request trong chu kỳ."
              required: false
              schema:
                type: string
            X-RATELIMIT-REMAINING:
              description: "Số request còn lại trong chu kỳ hiện tại."
              required: false
              schema:
                type: string
            X-RATELIMIT-RESET:
              description: "Thời điểm reset giới hạn request."
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: []
                properties:
                  message:
                    type: string
                    description: "Thông báo kết quả xử lý yêu cầu OTP."
                  transactionId:
                    type:
                      - string
                      - "null"
                    description: "Mã transaction trả về khi tài khoản dùng 2FA loại SmartOTP. Sau khi phê duyệt trên iBoard, dùng mã này để gọi `auth/token` trong vòng 30 giây để lấy token có quyền đặt lệnh."
        "400":
          description: "Request không hợp lệ."
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required: []
                properties:
                  code:
                    type: integer
                    description: "Mã lỗi."
                  msg:
                    type: string
                    description: "Chi tiết lỗi để hỗ trợ xử lý phía client."
  /api/v3/auth/refresh:
    post:
      tags:
        - Authentication
      operationId: ""
      summary: "auth-refresh"
      description: "Làm mới access token bằng refresh token còn hiệu lực."
      parameters: []
      requestBody:
        description: ""
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: "Refresh token còn hiệu lực để cấp mới access token."
      responses:
        "200":
          description: "Thành công."
          headers:
            X-RATELIMIT-LIMIT:
              description: "Giới hạn số request trong chu kỳ."
              required: false
              schema:
                type: string
            X-RATELIMIT-REMAINING:
              description: "Số request còn lại trong chu kỳ hiện tại."
              required: false
              schema:
                type: string
            X-RATELIMIT-RESET:
              description: "Thời điểm reset giới hạn request."
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: []
                properties:
                  tokenType:
                    type: string
                    description: "Loại token dùng trong header Authorization."
                  accessToken:
                    type: string
                    description: "Access token dùng để gọi các API nghiệp vụ."
                  expiresAt:
                    type: integer
                    description: "Thời điểm hết hạn của access token theo timestamp (epoch milliseconds)."
                  refreshToken:
                    type: string
                    description: "Refresh token dùng để xin access token mới khi hết hạn."
                  refreshExpiresAt:
                    type: integer
                    description: "Thời điểm hết hạn của refresh token theo timestamp (epoch milliseconds)."
        "400":
          description: "Request không hợp lệ."
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required: []
                properties:
                  code:
                    type: integer
                    description: "Mã lỗi."
                  msg:
                    type: string
                    description: "Chi tiết lỗi để hỗ trợ xử lý phía client."
  /api/v3/account/info:
    get:
      tags:
        - Trading
      operationId: ""
      summary: "account-info"
      description: "Lấy danh sách tài khoản giao dịch của khách hàng. Tài khoản có thể một trong ba loại CASH (thường); MARGIN (ký quỹ); DERIVATIVE (phái sinh). * DERIVATIVE (phái sinh)"
      security:
        - bearerAuth: []
      parameters:
        - name: "Content-Type"
          in: header
          required: true
          description: "Định dạng nội dung request body. Chủ yếu là application/json."
          schema:
            type: string
          example: ""
        - name: "User-Agent"
          in: header
          required: false
          description: "Thông tin client gửi request."
          schema:
            type: string
          example: ""
        - name: "Accept-Language"
          in: header
          required: false
          description: "Ngôn ngữ phản hồi mong muốn. Nếu không có header này, hệ thống sẽ mặc định là en"
          schema:
            type: string
          example: ""
      responses:
        "200":
          description: "Success"
          headers:
            X-RATELIMIT-LIMIT:
              description: "Giới hạn số request trong chu kỳ."
              required: false
              schema:
                type: string
            X-RATELIMIT-REMAINING:
              description: "Số request còn lại trong chu kỳ hiện tại."
              required: false
              schema:
                type: string
            X-RATELIMIT-RESET:
              description: "Thời điểm reset giới hạn request."
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: []
                  properties:
                    accountNo:
                      type: string
                      description: "Số tài khoản giao dịch."
                      example: "string"
                    accountType:
                      type: string
                      description: "Loại tài khoản giao dịch."
                      example: "CASH"
        "400":
          description: "Yêu cầu không hợp lệ."
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required: []
                properties:
                  code:
                    type: string
                    description: "Mã lỗi do hệ thống định nghĩa, dùng để xác định và phân loại lỗi; tham khảo tài liệu phụ lục để biết các mã lỗi có thể xảy ra."
                  msg:
                    type: string
                    description: "Thông điệp lỗi do hệ thống định nghĩa, giúp giải thích nguyên nhân và cách xử lý; nội dung tùy thuộc vào từng loại lỗi. Ngôn ngữ phản hồi phụ thuộc vào `Accept-Language` (en/vi); nếu thiếu hoặc không hợp lệ, hệ thống trả về tiếng Anh."
  /api/v3/trading/order:
    post:
      tags:
        - Trading
      operationId: ""
      summary: "trade-order-place"
      description: "Đặt lệnh mới."
      security:
        - bearerAuth: []
      parameters:
        - name: "Content-Type"
          in: header
          required: true
          description: "Định dạng nội dung request body. Chủ yếu là application/json."
          schema:
            type: string
          example: ""
        - name: "User-Agent"
          in: header
          required: false
          description: "Thông tin client gửi request."
          schema:
            type: string
          example: ""
        - name: "Accept-Language"
          in: header
          required: false
          description: "Ngôn ngữ phản hồi mong muốn. Nếu không có header này, hệ thống sẽ mặc định là en"
          schema:
            type: string
          example: ""
        - name: "X-Signature"
          in: header
          required: true
          description: "Chữ ký RSA + SHA256 để xác thực tính toàn vẹn của request. Input bao gồm SecretKey + JSON body."
          schema:
            type: string
          example: "sha256=abc123..."
      requestBody:
        description: ""
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountNo
                - symbol
                - side
                - orderType
                - quantity
                - price
                - deviceId
              properties:
                clientRequestId:
                  type:
                    - string
                    - "null"
                  description: "Định danh lệnh do client tạo ra để đối chiếu phản hồi. Nếu có, nên đảm bảo tính duy nhất; nếu để trống, hệ thống tự sinh định danh và trả về trong response và streaming."
                accountNo:
                  type: string
                  description: "Số tài khoản giao dịch."
                  example: "string"
                symbol:
                  type: string
                  description: "Mã chứng khoán."
                  example: "string"
                side:
                  type: string
                  description: "Chiều mua hoặc bán của lệnh giao dịch. (B- Buy/Mua, S- Sell/Bán)"
                  example: "B"
                orderType:
                  type: string
                  description: "Loại lệnh giao dịch. (LO - Limit Order/Lệnh giới hạn, ATO - At The Open/Lệnh mở cửa, ATC - At The Close/Lệnh đóng cửa, MP - Market Price/Giá thị trường)"
                  example: "LO"
                quantity:
                  type: number
                  description: "Khối lượng đặt lệnh."
                  example: 0.1
                price:
                  type: string
                  description: "Giá đặt lệnh. Bắt buộc khi orderType là LO (Lệnh giới hạn); không bắt buộc với các loại lệnh khác (ATO, ATC, MP)."
                  example: "string"
                deviceId:
                  type: string
                  description: "Định danh thiết bị thực hiện gửi yêu cầu đặt lệnh. Thông thường dùng MAC address hoặc IMEI của thiết bị."
                  example: "string"
                userAgent:
                  type: string
                  description: "Thông tin về trình duyệt hoặc ứng dụng gửi yêu cầu."
                ipAddress:
                  type: string
                  description: "Địa chỉ IP của thiết bị gửi yêu cầu."
      responses:
        "200":
          description: "Success"
          headers:
            X-RATELIMIT-LIMIT:
              description: "Giới hạn số request trong chu kỳ."
              required: false
              schema:
                type: string
            X-RATELIMIT-REMAINING:
              description: "Số request còn lại trong chu kỳ hiện tại."
              required: false
              schema:
                type: string
            X-RATELIMIT-RESET:
              description: "Thời điểm reset giới hạn request."
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: []
                properties:
                  clientRequestId:
                    type: string
                    description: ""
                    example: "string"
                  orderId:
                    type: string
                    description: ""
                    example: "string"
                  orderStatus:
                    type: string
                    description: ""
                    example: "string"
                  clientModifyId:
                    type: string
                    description: ""
                    example: "string"
                  clientCancelId:
                    type: string
                    description: ""
                    example: "string"
        "400":
          description: ""
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required: []
                properties: {}
    put:
      tags:
        - Trading
      operationId: ""
      summary: "trade-order-modify"
      description: "Sửa lệnh hiện có."
      security:
        - bearerAuth: []
      parameters:
        - name: "Content-Type"
          in: header
          required: true
          description: "Định dạng nội dung request body. Chủ yếu là application/json."
          schema:
            type: string
          example: ""
        - name: "User-Agent"
          in: header
          required: false
          description: "Thông tin client gửi request."
          schema:
            type: string
          example: ""
        - name: "Accept-Language"
          in: header
          required: false
          description: "Ngôn ngữ phản hồi mong muốn. Nếu không có header này, hệ thống sẽ mặc định là en"
          schema:
            type: string
          example: ""
        - name: "X-Signature"
          in: header
          required: true
          description: "Chữ ký RSA + SHA256 để xác thực tính toàn vẹn của request. Input bao gồm SecretKey + JSON body."
          schema:
            type: string
          example: "sha256=abc123..."
      requestBody:
        description: ""
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountNo
                - deviceId
              properties:
                clientModifyId:
                  type:
                    - string
                    - "null"
                  description: "Định danh sửa lệnh do client tạo ra để đối chiếu phản hồi. Nếu có, nên đảm bảo tính duy nhất; nếu để trống, hệ thống tự sinh định danh và trả về trong response và streaming."
                clientRequestId:
                  type:
                    - string
                    - "null"
                  description: "Định danh lệnh gốc do client tạo ra khi đặt lệnh. Khi để trống thì hệ thống sẽ không đối chiếu dựa trên định danh lệnh gốc mà sẽ dựa vào `orderId` để xác định lệnh cần sửa."
                orderId:
                  type:
                    - string
                    - "null"
                  description: "Định danh lệnh gốc sinh ra bởi hệ thống SSI."
                accountNo:
                  type: string
                  description: "Số tài khoản giao dịch."
                  example: "string"
                symbol:
                  type:
                    - string
                    - "null"
                  description: "Mã chứng khoán."
                side:
                  type:
                    - string
                    - "null"
                  description: "Chiều mua hoặc bán của lệnh giao dịch. (B- Buy/Mua, S- Sell/Bán)"
                orderType:
                  type:
                    - string
                    - "null"
                  description: "Loại lệnh giao dịch. (LO - Limit Order/Lệnh giới hạn, ATO - At The Open/Lệnh mở cửa, ATC - At The Close/Lệnh đóng cửa, MP - Market Price/Giá thị trường)"
                price:
                  type:
                    - string
                    - "null"
                  description: "Giá thay đổi của lệnh. Trường này có thể không bắt buộc tùy theo loại lệnh và quy định sửa lệnh của sàn giao dịch. Ví dụ, đối với lệnh MP (Market Price), giá có thể không cần cung cấp khi sửa lệnh."
                quantity:
                  type:
                    - number
                    - "null"
                  description: "Khối lượng thay đổi của lệnh. Trường này có thể không bắt buộc tùy theo quy định sửa lệnh của sàn giao dịch. Ví dụ, một số sàn có thể chỉ cho phép sửa giá mà không cho phép sửa khối lượng, hoặc ngược lại."
                deviceId:
                  type: string
                  description: "Định danh thiết bị thực hiện gửi yêu cầu sửa lệnh. Thông thường dùng MAC address hoặc IMEI của thiết bị."
                  example: "string"
                userAgent:
                  type:
                    - string
                    - "null"
                  description: "Thông tin về trình duyệt hoặc ứng dụng gửi yêu cầu."
                ipAddress:
                  type:
                    - string
                    - "null"
                  description: "Địa chỉ IP của thiết bị gửi yêu cầu."
      responses:
        "200":
          description: "Success"
          headers:
            X-RATELIMIT-LIMIT:
              description: "Giới hạn số request trong chu kỳ."
              required: false
              schema:
                type: string
            X-RATELIMIT-REMAINING:
              description: "Số request còn lại trong chu kỳ hiện tại."
              required: false
              schema:
                type: string
            X-RATELIMIT-RESET:
              description: "Thời điểm reset giới hạn request."
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: []
                properties:
                  clientRequestId:
                    type: string
                    description: ""
                    example: "string"
                  orderId:
                    type: string
                    description: ""
                    example: "string"
                  orderStatus:
                    type: string
                    description: ""
                    example: "string"
                  clientModifyId:
                    type: string
                    description: ""
                    example: "string"
                  clientCancelId:
                    type: string
                    description: ""
                    example: "string"
        "400":
          description: ""
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required: []
                properties: {}
    delete:
      tags:
        - Trading
      operationId: ""
      summary: "trade-order-cancel"
      description: "Hủy lệnh hiện có."
      security:
        - bearerAuth: []
      parameters:
        - name: "Content-Type"
          in: header
          required: true
          description: "Định dạng nội dung request body. Chủ yếu là application/json."
          schema:
            type: string
          example: ""
        - name: "User-Agent"
          in: header
          required: false
          description: "Thông tin client gửi request."
          schema:
            type: string
          example: ""
        - name: "Accept-Language"
          in: header
          required: false
          description: "Ngôn ngữ phản hồi mong muốn. Nếu không có header này, hệ thống sẽ mặc định là en"
          schema:
            type: string
          example: ""
        - name: "X-Signature"
          in: header
          required: true
          description: "Chữ ký RSA + SHA256 để xác thực tính toàn vẹn của request. Input bao gồm SecretKey + JSON body."
          schema:
            type: string
          example: "sha256=abc123..."
      requestBody:
        description: ""
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountNo
                - deviceId
              properties:
                clientCancelId:
                  type:
                    - string
                    - "null"
                  description: "Định danh hủy lệnh do client tạo ra để đối chiếu phản hồi. Nếu có, nên đảm bảo tính duy nhất; nếu để trống, hệ thống tự sinh định danh và trả về trong response và streaming."
                clientRequestId:
                  type:
                    - string
                    - "null"
                  description: "Định danh lệnh gốc do client tạo ra khi đặt lệnh. Khi để trống thì hệ thống sẽ không đối chiếu dựa trên định danh lệnh gốc mà sẽ dựa vào `orderId` để xác định lệnh cần hủy."
                orderId:
                  type:
                    - string
                    - "null"
