    TradingApiSubscribeRequest:
      type: object
      description: "Message client gửi để subscribe/unsubscribe hoặc ping/pong kiểm tra kết nối. Không có trường `id`."
      required:
        - method
      properties:
        method:
          type: string
          description: "Hành động của request. Không phân biệt hoa thường."
          enum:
            - SUBSCRIBE
        channel:
          type: string
          description: "Kênh dữ liệu cần đăng ký. Chỉ `TRADING` được hỗ trợ cho SUBSCRIBE/UNSUBSCRIBE (bỏ qua với PING_PONG/PING_ONLY)."
          enum:
            - TRADING
        topics:
          type: array
          description: "Danh sách topic cần đăng ký/hủy đăng ký, cú pháp `{type}.{accountNo}` với `type` ∈ `order, portfolio`. Wildcard `*` cho accountNo **không được hỗ trợ** (khác với FastConnect WebSocket API) — mỗi topic phải chỉ định chính xác một `accountNo` thuộc quyền sở hữu của API Key. Rỗng khi UNSUBSCRIBE nghĩa là hủy toàn bộ topic đang subscribe."
          items:
            type: string
            description: ""
      examples:
        - method: "SUBSCRIBE"
          channel: "TRADING"
          topics:
            - "order.0901351"
            - "portfolio.1231996"

    TradingApiUnsubscribeRequest:
      type: object
      description: "Message client gửi để subscribe/unsubscribe hoặc ping/pong kiểm tra kết nối. Không có trường `id`."
      required:
        - method
      properties:
        method:
          type: string
          description: "Hành động của request. Không phân biệt hoa thường."
          enum:
            - UNSUBSCRIBE
        channel:
          type: string
          description: "Kênh dữ liệu cần đăng ký. Chỉ `TRADING` được hỗ trợ cho SUBSCRIBE/UNSUBSCRIBE (bỏ qua với PING_PONG/PING_ONLY)."
          enum:
            - TRADING
        topics:
          type: array
          description: "Danh sách topic cần đăng ký/hủy đăng ký, cú pháp `{type}.{accountNo}` với `type` ∈ `order, portfolio`. Wildcard `*` cho accountNo **không được hỗ trợ** (khác với FastConnect WebSocket API) — mỗi topic phải chỉ định chính xác một `accountNo` thuộc quyền sở hữu của API Key. Rỗng khi UNSUBSCRIBE nghĩa là hủy toàn bộ topic đang subscribe."
          items:
            type: string
            description: ""

