          title: tradingTime
          description: "YYYY/MM/DD HH:mi:ss"
        p:
          type: string
          title: price
          description: "Giá khớp"
        q:
          type: string
          title: quantity
          description: "Khối lượng khớp"
        a:
          type: string
          title: avgPrice
          description: "Giá khớp trung bình"
        si:
          type: string
          title: side
          description: "B: Buy Up (mua chủ động) / S: Sell Down (bán chủ động)"
