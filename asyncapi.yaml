              type: string
              description: "Giá đặt (đơn vị đồng) — Giá số (vd: \"23500\") hoặc \"MP\", \"MOK\", \"MTL\""
            account:
              type: string
              description: "Tiểu khoản đặt lệnh (ví dụ tài khoản đuôi 8, đuôi 6)"
            updatedTime:
              type: string
              description: "Thời gian cập nhật (Unix timestamp milliseconds) — \"1751966448000\""
            status:
              type: string
              description: "Mã trạng thái — Tham chiếu bảng mã lỗi"
            message:
              type: string
              description: "Thông báo kết quả hoặc lỗi"
            username:
              type: string
              description: "ID người dùng tại SSI"

    TradeEvent:
      type: object
      properties:
        s:
          type: string
          title: symbol
          description: "Mã chứng khoán"
