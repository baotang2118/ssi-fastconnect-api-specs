          o: "45.00"
          h: "45.80"
          l: "44.90"
          v: "1250000"

    RoomEvent:
      type: object
      properties:
        s:
          type: string
          title: symbol
          description: "Mã chứng khoán"
        t:
          type: string
          title: tradingtime
          description: "YYYY/MM/DD HH:mi:ss"
        tr:
          type: string
          title: totalRoom
          description: "Tổng room ngoại"
