            notifyID:
              type: number
              description: "ID thông báo"
            processStatus:
              type: string
              description: "Trạng thái xử lý lệnh điều kiện — Tham khảo Phụ lục FCO"
            matchedQuantity:
              type: number
              description: "Khối lượng đã khớp"
            isPlaceOrder:
              type: boolean
              description: "Trạng thái phát sinh lệnh con — true: Có lệnh thực phát sinh (xuất hiện lệnh ở Orderbook). false: Chưa có lệnh thực phát sinh"
            instrumentID:
              type: string
              description: "Mã chứng khoán. Đối với phái sinh, truyền theo mã tổng quát hoặc chi tiết: 1M, 2M, 1Q, 2Q, VN30FYYMM"
