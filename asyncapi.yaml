    TradingApiSubscribeRequest:
      name: TradingApiSubscribeRequest
      title: "SUBSCRIBE request"
      contentType: application/json
      description: "Subscribe sample:\n\n```json\n{ \"method\": \"SUBSCRIBE\", \"channel\": \"TRADING\", \"topics\": [\"order.0901351\", \"portfolio.1231996\"] }\n```\n\nMessage này không cần chữ ký và không mang `id`."
      payload:
        $ref: "#/components/schemas/TradingApiSubscribeRequest"

    TradingApiUnsubscribeRequest:
      name: TradingApiUnsubscribeRequest
      title: "UNSUBSCRIBE request"
      contentType: application/json
      description: "Rỗng khi UNSUBSCRIBE nghĩa là hủy toàn bộ topic đang subscribe.\n\nMessage này không cần chữ ký và không mang `id`."
      payload:
        $ref: "#/components/schemas/TradingApiUnsubscribeRequest"

    TradingApiSubscriptionAck:
      name: TradingApiSubscriptionAck
      title: "Ack subscribe/unsubscribe"
      contentType: application/json
      description: "Ack:\n\n```json\n{ \"method\": \"SUBSCRIBE\", \"channel\": \"TRADING\", \"status\": \"ok\", \"message\": \"Subscribed to 2 topic(s)\" }\n```\n\nNếu `status: \"error\"`, `message` mô tả lý do (topic sai cú pháp, thiếu quyền, hoặc tài khoản không thuộc quyền sở hữu)."
      payload:
        $ref: "#/components/schemas/TradingApiSubscriptionAck"

    TradingApiNotification:
      name: TradingApiNotification
      title: "Thông báo order/portfolio"
      contentType: application/json
      description: "Ví dụ thông báo (`order.{accountNo}`):\n\n```json\n{ \"channel\": \"TRADING\", \"topic\": \"order.0901351\", \"data\": { \"eventType\": \"orderEvent\", \"clientRequestId\": \"req-0001\", \"orderId\": \"ORD123456\", \"orderStatus\": \"FF\", \"...\": \"...\" } }\n```\n\nCấu trúc dữ liệu thông báo giống với channel `TRADING` của FastConnect WebSocket API (dữ liệu thị trường) — xem chi tiết field tại [Sub/Unsub Trading Data](https://developers.ssi.com.vn/docs/api-reference/subscribeUnsubscribeTradingData)."
      payload:
        $ref: "#/components/schemas/TradingApiNotification"

    TradingApiErrorResponse:
      name: TradingApiErrorResponse
      title: "Response lỗi (default)"
      contentType: application/json
      correlationId:
        description: "`id` — trả lại đúng `id` của request."
        location: "$message.payload#/id"
      description: "Response lỗi chung của WebSocket API. Với `fco.place` và `fco.cancel`, nếu bị từ chối response trả về `error.code: \"FCO_ERROR\"`. Với `fco.statusHistory`, nếu bị lỗi HOẶC danh sách lịch sử rỗng, response trả về `error.code: \"FCO_ERROR\"`."
      payload:
        $ref: "#/components/schemas/TradingApiErrorResponse"

  schemas:
    WsMethod:
      type: string
      description: "`SUBSCRIBE|UNSUBSCRIBE|LIST_SUBSCRIPTION|PING|PONG`"
      enum:
        - SUBSCRIBE
        - UNSUBSCRIBE
        - LIST_SUBSCRIPTION
        - PING
        - PONG

    WsChannel:
      type: string
      description: "`TRADING|DATA|HEARTBEAT`"
      enum:
        - TRADING
        - DATA
        - HEARTBEAT

    SubscribeRequest:
      type: object
      description: ""
      properties:
        method:
          type: string
          enum:
            - SUBSCRIBE
          description: ""
        channel:
          type: string
          enum:
            - TRADING
            - DATA
          description: ""
        topics:
          type: array
          description: ""
          items:
            type: string
            description: ""

    UnsubscribeRequest:
      type: object
      description: ""
      properties:
        method:
          type: string
          enum:
            - UNSUBSCRIBE
          description: ""
        channel:
          type: string
          enum:
            - TRADING
            - DATA
          description: ""
        topics:
          type: array
          description: ""
          items:
            type: string
            description: ""

    ListSubscriptionRequest:
      type: object
      description: ""
      properties:
        method:
          type: string
          enum:
            - LIST_SUBSCRIPTION
          description: ""

    ListSubscriptionResponse:
      type: object
      description: ""
      properties:
        trading:
          type: string
          description: ""
        data:
          type: string
          description: ""

    Ping:
      type: object
      description: ""
      properties:
        method:
          type: string
          enum:
            - PING
          description: ""
        channel:
          type: string
          enum:
            - HEARTBEAT
          description: ""
        time:
          type: string
          description: ""
          examples:
            - "dd-mm-yyyy hh-mm-ss"

    Pong:
      type: object
      description: ""
      properties:
        method:
          type: string
          enum:
            - PONG
          description: ""
        channel:
          type: string
          enum:
            - HEARTBEAT
          description: ""
        time:
          type: string
          description: ""
          examples:
            - "dd-mm-yyyy hh-mm-ss"

    OrderEvent:
      type: object
      properties:
        eventType:
          type: string
          description: "Loại event: \"orderEvent\""
        notifyId:
          type: integer
          format: int64
          description: "Số serial của event message"
        connectionId:
          type: string
          description: "Định danh phiên kết nối stream của client"
        clientRequestId:
          type: string
          description: "Định danh lệnh trong ngày, tự động sinh nếu không truyền. Dùng để đối chiếu tương ứng với lệnh từ đầu client"
        orderId:
          type: string
          description: "Số định danh lệnh được ghi nhận tại hệ thống giao dịch"
        symbol:
          type: string
          description: "Mã chứng khoán"
        side:
          type: string
          description: "Chiều mua/bán của lệnh (B → BUY / S → SELL)"
        orderType:
          type: string
          description: "Loại lệnh (LO, ATO, ATC,...)"
        accountNo:
          type: string
          description: "Số tài khoản đặt lệnh"
        price:
          type: string
          description: "Giá"
        quantity:
          type: number
          description: "Khối lượng"
        cancelQty:
          type: number
          description: "Khối lượng đã hủy"
        osQty:
          type: number
          description: "Khối lượng chưa khớp"
        filledQty:
          type: number
          description: "Khối lượng khớp"
        inputTime:
          type: string
          description: "Thời gian tiếp nhận đặt lệnh (format theo quy chuẩn chung)"
        modifiedTime:
          type: string
          description: "Thời gian sửa, cập nhật trạng thái lệnh (format theo quy chuẩn chung)"
        orderStatus:
          type: string
          description: "Trạng thái lệnh, tham chiếu theo bảng trạng thái lệnh"
        rejectReason:
          type: string
          description: "Lý do từ chối"
        errorCode:
          type: string
          description: "Mã lỗi lệnh"
        errorMessage:
          type: string
          description: "Thông tin lệnh lỗi"

    OrderMatchEvent:
      type: object
      properties:
        eventType:
          type: string
          description: "Loại event: \"orderMatchEvent\""
        notifyId:
          type: integer
          format: int64
          description: "Số serial của event message"
        connectionId:
          type: string
          description: "Định danh phiên kết nối stream của client"
        clientRequestId:
          type: string
          description: "Định danh lệnh trong ngày, tự động sinh nếu không truyền. Dùng để đối chiếu tương ứng với lệnh từ đầu client"
        orderId:
          type: string
          description: "Số định danh lệnh được ghi nhận tại hệ thống giao dịch"
        symbol:
          type: string
          description: "Mã chứng khoán"
        side:
          type: string
          description: "Chiều mua/bán của lệnh (B → BUY / S → SELL)"
        accountNo:
          type: string
          description: "Số tài khoản đặt lệnh"
        matchPrice:
          type: string
          description: "Giá khớp"
        matchQty:
          type: number
          description: "Khối lượng khớp"
        matchTime:
          type: string
          description: "Thời gian khớp (format theo quy chuẩn chung)"

    ClientPortfolioEvent:
      type: object
      properties:
        eventType:
          type: string
          description: "Loại event: \"clientPortfolioEvent\""
        notifyId:
          type: integer
          format: int64
          description: "Số serial của event message"
        connectionId:
          type: string
          description: "Định danh phiên kết nối stream của client"
        symbol:
          type: string
          description: "Mã chứng khoán"
        accountNo:
          type: string
          description: "Số tài khoản"
        longQty:
