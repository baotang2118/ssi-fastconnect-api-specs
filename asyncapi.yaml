asyncapi: 3.0.0
info:
  title: "FastConnect WebSocket"
  version: "3.2.0"
  description: "AsyncAPI specification for SSI FastConnect WebSockets: market/trading streams at `wss://stream.ssi.com.vn` and the request/response trading API at `wss://api.ssi.com.vn/ws/v3/trading`. Covers authentication, subscriptions, heartbeat, market and trading events, signed order/FCO methods, unsigned query methods, ping/pong, and order/portfolio notifications."

servers:
  stream:
    host: "stream.ssi.com.vn"
    protocol: "wss"
    description: "FastConnect WebSocket stream tại `wss://stream.ssi.com.vn` cung cấp dữ liệu giao dịch và thị trường theo thời gian thực. Lấy token qua API auth trước khi kết nối, duy trì heartbeat và subscribe lại các topic sau khi reconnect."

  tradingApi:
    host: "api.ssi.com.vn"
    pathname: "/ws/v3/trading"
    protocol: "wss"
    title: "WebSocket API"
    summary: "Kết nối WebSocket API"
    security:
      - $ref: "#/components/securitySchemes/tradingApiTokenQuery"
      - $ref: "#/components/securitySchemes/tradingApiBearerToken"
    description: "Kết nối `/ws/v3/trading` qua HTTP Upgrade (`101` khi thành công). Xác thực JWT qua query `?token=<jwt>` hoặc header `Authorization: Bearer <jwt>`. Tối đa 10 kết nối/API Key. Ngoài lỗi upgrade `400`, server gửi lỗi từ chối sau khi kết nối; client nên đọc message đầu tiên. API đang thử nghiệm nội bộ, chưa phát hành chính thức."

channels:
  marketStream:
    address: "/"
    servers:
      - $ref: "#/servers/stream"
    title: "FastConnect streaming channel"
    description: "Message dùng `method`, `channel`, `topics`; method gồm SUBSCRIBE/UNSUBSCRIBE/LIST_SUBSCRIPTION/PING/PONG. TRADING gồm event lệnh/FCO và danh mục; `portfolio` chỉ hỗ trợ tài khoản phái sinh đuôi 8. DATA gồm trade/quote/room/put/oddlot/market. Topic nhận mã, nhóm/sàn hoặc `*`; interval mặc định `tick`, market không dùng interval."
    messages:
      subscribeRequest:
        $ref: "#/components/messages/SubscribeRequest"
      unsubscribeRequest:
        $ref: "#/components/messages/UnsubscribeRequest"
      listSubscriptionRequest:
        $ref: "#/components/messages/ListSubscriptionRequest"
      pong:
        $ref: "#/components/messages/Pong"
      ping:
        $ref: "#/components/messages/Ping"
      listSubscriptionResponse:
        $ref: "#/components/messages/ListSubscriptionResponse"
      orderEvent:
        $ref: "#/components/messages/OrderEvent"
      orderMatchEvent:
        $ref: "#/components/messages/OrderMatchEvent"
      clientPortfolioEvent:
        $ref: "#/components/messages/ClientPortfolioEvent"
      fcoEvent:
        $ref: "#/components/messages/FcoEvent"
      tradeEvent:
        $ref: "#/components/messages/TradeEvent"
      quoteEvent:
        $ref: "#/components/messages/QuoteEvent"
      roomEvent:
        $ref: "#/components/messages/RoomEvent"
      putEvent:
        $ref: "#/components/messages/PutEvent"
      oddlotEvent:
        $ref: "#/components/messages/OddlotEvent"
      marketEvent:
        $ref: "#/components/messages/MarketEvent"
      marketFlagEvent:
        $ref: "#/components/messages/MarketFlagEvent"

  tradingApi:
    address: "/"
    servers:
      - $ref: "#/servers/tradingApi"
    title: "WebSocket API channel"
    description: "WebSocket API cho phép đặt/sửa/hủy lệnh thường, đặt/hủy lệnh điều kiện (FCO), và tra cứu vị thế/số dư/sổ lệnh — tất cả trên một kết nối WebSocket duy nhất, độ trễ thấp hơn nhiều so với gọi REST cho từng lệnh. Trên cùng kết nối, bạn cũng có thể đăng ký nhận thông báo ngay khi lệnh khớp hoặc tài khoản có thay đổi.\n\n## Envelope request\n\nMọi request nghiệp vụ (`order.*`, `fco.*`, `query.*`) dùng chung envelope:\n\n```json\n{\n  \"id\": \"req-0001\",\n  \"method\": \"order.place\",\n  \"params\": { },\n  \"signature\": \"base64(RSA-SHA256(...))\",\n  \"timestamp\": 1755000000000\n}\n```\n\n`id` do client tự sinh để đối chiếu response; response trả lại đúng `id` đó.\n\n## Envelope response\n\n```json\n{\n  \"id\": \"req-0001\",\n  \"method\": \"order.place\",\n  \"status\": 200,\n  \"result\": { },\n  \"rateLimit\": { \"limit\": 50, \"remaining\": 47, \"resetMs\": 900 }\n}\n```\n\n## Message không mang `id`\n\n`ping_pong` / `ping_only` và `SUBSCRIBE` / `UNSUBSCRIBE` không cần chữ ký và không mang `id`."
    messages:
      pingPongRequest:
        $ref: "#/components/messages/TradingApiPingPongRequest"
      pingPongResponse:
        $ref: "#/components/messages/TradingApiPingPongResponse"
      connectionRejectMessage:
        $ref: "#/components/messages/TradingApiConnectionRejectMessage"
      orderPlaceRequest:
        $ref: "#/components/messages/OrderPlaceRequest"
      orderPlaceResponse:
        $ref: "#/components/messages/OrderPlaceResponse"
      orderAmendRequest:
        $ref: "#/components/messages/OrderAmendRequest"
      orderAmendResponse:
        $ref: "#/components/messages/OrderAmendResponse"
      orderCancelRequest:
        $ref: "#/components/messages/OrderCancelRequest"
      orderCancelResponse:
        $ref: "#/components/messages/OrderCancelResponse"
      fcoPlaceRequest:
        $ref: "#/components/messages/FcoPlaceRequest"
      fcoPlaceResponse:
        $ref: "#/components/messages/FcoPlaceResponse"
      fcoCancelRequest:
        $ref: "#/components/messages/FcoCancelRequest"
      fcoCancelResponse:
        $ref: "#/components/messages/FcoCancelResponse"
      fcoOrderbookRequest:
        $ref: "#/components/messages/FcoOrderbookRequest"
      fcoOrderbookResponse:
        $ref: "#/components/messages/FcoOrderbookResponse"
      fcoListRequest:
        $ref: "#/components/messages/FcoListRequest"
      fcoListResponse:
        $ref: "#/components/messages/FcoListResponse"
      fcoStatusHistoryRequest:
        $ref: "#/components/messages/FcoStatusHistoryRequest"
      fcoStatusHistoryResponse:
        $ref: "#/components/messages/FcoStatusHistoryResponse"
      queryPositionRequest:
        $ref: "#/components/messages/QueryPositionRequest"
      queryPositionResponse:
        $ref: "#/components/messages/QueryPositionResponse"
      queryMaxBuySellRequest:
        $ref: "#/components/messages/QueryMaxBuySellRequest"
      queryMaxBuySellResponse:
        $ref: "#/components/messages/QueryMaxBuySellResponse"
      queryAccountBalanceRequest:
        $ref: "#/components/messages/QueryAccountBalanceRequest"
      queryAccountBalanceResponse:
        $ref: "#/components/messages/QueryAccountBalanceResponse"
      queryPpmmrAccountRequest:
        $ref: "#/components/messages/QueryPpmmrAccountRequest"
      queryPpmmrAccountResponse:
        $ref: "#/components/messages/QueryPpmmrAccountResponse"
      queryOrderBookRequest:
        $ref: "#/components/messages/QueryOrderBookRequest"
      queryOrderBookResponse:
        $ref: "#/components/messages/QueryOrderBookResponse"
      tradingApiSubscribeRequest:
        $ref: "#/components/messages/TradingApiSubscribeRequest"
      tradingApiUnsubscribeRequest:
        $ref: "#/components/messages/TradingApiUnsubscribeRequest"
      tradingApiSubscriptionAck:
        $ref: "#/components/messages/TradingApiSubscriptionAck"
      tradingApiNotification:
        $ref: "#/components/messages/TradingApiNotification"
      tradingApiErrorResponse:
        $ref: "#/components/messages/TradingApiErrorResponse"

operations:
  subscribe:
    action: send
    channel:
      $ref: "#/channels/marketStream"
    title: "Subscribe topic"
    description: "Gửi `SUBSCRIBE` trên channel `TRADING` hoặc `DATA`; có thể đăng ký nhiều topic cùng lúc. Topic lặp bị bỏ qua và cần đăng ký lại sau reconnect. `order.*` nhận event lệnh/FCO, `portfolio.*` nhận event danh mục. Topic DATA nhận symbol, danh sách mã, nhóm chỉ số hoặc sàn; cú pháp tương tự áp dụng cho trade, quote, room, put, oddlot và market."
    messages:
      - $ref: "#/channels/marketStream/messages/subscribeRequest"

  unsubscribe:
    action: send
    channel:
      $ref: "#/channels/marketStream"
    title: "Unsubscribe topic"
    description: "## Unsubscribe\n\nGửi message với `method: \"UNSUBSCRIBE\"` và `channel: \"TRADING\"`:\n\n```json\n{\n  \"method\": \"UNSUBSCRIBE\",\n  \"channel\": \"TRADING\",\n  \"topics\": [\"order.0901351\", \"portfolio.0901351\"]\n}\n```\n\n### Quy tắc unsubscribe\n\n• Chỉ unsubscribe các topic đã subscribe trước đó.\n• Unsubscribe topic chưa subscribe không gây lỗi — server bỏ qua.\n• Unsubscribe không ảnh hưởng đến các topic khác đang subscribe.\n• Để kiểm tra danh sách topic đang subscribe, dùng `LIST_SUBSCRIPTION`.\n\n## Unsubscribe market data\n\n```json\n{\n  \"method\": \"UNSUBSCRIBE\",\n  \"channel\": \"DATA\",\n  \"topics\": [\"trade.SSI\", \"quote.SSI\"]\n}\n```"
    messages:
      - $ref: "#/channels/marketStream/messages/unsubscribeRequest"

  listSubscription:
    action: send
    channel:
      $ref: "#/channels/marketStream"
    title: "List subscription"
    description: "## Kiểm tra subscription hiện tại\n\n```json\n{\n  \"method\": \"LIST_SUBSCRIPTION\"\n}\n```\n\nClient có thể kiểm tra scope hiện tại bằng request. Response trả về các quyền truy cập theo nhóm trading/data."
    messages:
      - $ref: "#/channels/marketStream/messages/listSubscriptionRequest"

  sendPong:
    action: send
    channel:
      $ref: "#/channels/marketStream"
    title: "Pong từ client"
    description: "## Pong từ client\n\n```json\n{\n  \"method\": \"PONG\",\n  \"channel\": \"HEARTBEAT\",\n  \"time\": \"dd-mm-yyyy hh-mm-ss\"\n}\n```\n\nServer gửi heartbeat định kỳ để xác nhận client còn online. Client phải phản hồi đúng định dạng để session không bị đóng."
    messages:
      - $ref: "#/channels/marketStream/messages/pong"

  receivePing:
    action: receive
    channel:
      $ref: "#/channels/marketStream"
    title: "Ping từ server"
    description: "## Heartbeat\n\nServer gửi heartbeat định kỳ để xác nhận client còn online. Client phải phản hồi đúng định dạng để session không bị đóng.\n\n## Channel sử dụng\n\n`HEARTBEAT`\n\n## Ping từ server\n\n```json\n{\n  \"method\": \"PING\",\n  \"channel\": \"HEARTBEAT\",\n  \"time\": \"dd-mm-yyyy hh-mm-ss\"\n}\n```"
    messages:
      - $ref: "#/channels/marketStream/messages/ping"

  receiveListSubscription:
    action: receive
    channel:
      $ref: "#/channels/marketStream"
    title: "LIST_SUBSCRIPTION response"
    description: "## LIST_SUBSCRIPTION\n\nResponse mẫu (tóm tắt scope):\n\n```json\n{\n  \"trading\": \"order.*;portfolio.123456\",\n  \"data\": \"trade.*;quote.*;room.*\"\n}\n```\n\nResponse trả về scope theo nhóm:\n\n```json\n{\n  \"trading\": \"order.0901351;portfolio.0901351\",\n  \"data\": \"\"\n}\n```"
    messages:
      - $ref: "#/channels/marketStream/messages/listSubscriptionResponse"

  receiveTradingEvents:
    action: receive
    channel:
      $ref: "#/channels/marketStream"
    title: "TRADING channel events"
    description: "## Các loại event\n\nSau khi subscribe thành công, client sẽ nhận các event sau theo thời gian thực.\n\n### Binding event trong SDK\n\n```js\nclient.bind(client.events.onOrderEvent, function (e, data) {\n  console.log(e + \": \");\n  console.log(JSON.stringify(data));\n});\nclient.bind(client.events.onOrderMatchEvent, function (e, data) {\n  console.log(e + \": \");\n  console.log(JSON.stringify(data));\n});\nclient.bind(client.events.onClientPortfolioEvent, function (e, data) {\n  console.log(e + \": \");\n  console.log(JSON.stringify(data));\n});\n```\n\n> “Sự kiện lệnh điều kiện (FCO) được trả về qua cùng binding `onClientPortfolioEvent`.”"
    messages:
      - $ref: "#/channels/marketStream/messages/orderEvent"
      - $ref: "#/channels/marketStream/messages/orderMatchEvent"
      - $ref: "#/channels/marketStream/messages/clientPortfolioEvent"
      - $ref: "#/channels/marketStream/messages/fcoEvent"

  receiveMarketDataEvents:
    action: receive
    channel:
      $ref: "#/channels/marketStream"
    title: "DATA channel events"
    description: "## Tổng quan\n\nKênh DATA trả về 6 nhóm thông tin thị trường:\n\n| Nhóm | Mô tả |\n| --- | --- |\n| trade | Thông tin khớp lệnh |\n| quote | Thông tin bid/ask |\n| room | Thông tin room ngoại |\n| put | Khớp lệnh thỏa thuận |\n| oddlot | Giao dịch lô lẻ |\n| market | Thông tin đầu ngày và cờ phiên |"
    messages:
      - $ref: "#/channels/marketStream/messages/tradeEvent"
      - $ref: "#/channels/marketStream/messages/quoteEvent"
      - $ref: "#/channels/marketStream/messages/roomEvent"
      - $ref: "#/channels/marketStream/messages/putEvent"
      - $ref: "#/channels/marketStream/messages/oddlotEvent"
      - $ref: "#/channels/marketStream/messages/marketEvent"
      - $ref: "#/channels/marketStream/messages/marketFlagEvent"

  tradingApiSendPingPong:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "ping_pong"
    description: "Client có thể gửi `ping_pong` hoặc `ping_only` để kiểm tra kết nối; server trả ack trên channel `HEARTBEAT`. Request không cần chữ ký hoặc `id`. Server cũng phát heartbeat mỗi 30 giây; client không bắt buộc ping nhưng nên dùng để phát hiện kết nối bị treo."
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/pingPongResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/pingPongRequest"

  tradingApiReceivePingPong:
    action: receive
    channel:
      $ref: "#/channels/tradingApi"
    title: "ping_pong ack / heartbeat"
    description: "Server trả pong trên channel `HEARTBEAT` và tự phát heartbeat mỗi 30 giây. Client nên gửi ping để phát hiện sớm kết nối bị treo."
    messages:
      - $ref: "#/channels/tradingApi/messages/pingPongResponse"

  tradingApiReceiveConnectionReject:
    action: receive
    channel:
      $ref: "#/channels/tradingApi"
    title: "Message từ chối kết nối"
    description: "Ngoài lỗi WebSocket upgrade `400`, server gửi lý do từ chối sau khi kết nối thành công (`101`), rồi đóng kết nối. Client nên đọc message đầu tiên để xác định kết nối sẵn sàng hay chưa. Mã lỗi có thể gồm `401` token không hợp lệ, `403` thiếu quyền, `429` vượt giới hạn kết nối hoặc `500` lỗi hệ thống."
    messages:
      - $ref: "#/channels/tradingApi/messages/connectionRejectMessage"

  tradingApiOrderPlace:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "order.place"
    description: "Đặt lệnh mới. Ack `PD` xác nhận đã nhận yêu cầu; trạng thái khớp thực tế gửi sau qua `order.{accountNo}`. Yêu cầu chữ ký `signature` (RSA+SHA256). Scope: `tradingws:order:post`."
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/orderPlaceResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/orderPlaceRequest"

  tradingApiOrderAmend:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "order.amend"
    description: "# order.amend\n\nSửa lệnh hiện có. Xác định lệnh cần sửa qua `orderId` HOẶC `clientRequestId` (bắt buộc truyền đúng một trong hai — truyền cả hai hoặc không truyền gì đều bị từ chối). Cùng luồng ack nhanh `PD` như `order.place`. Yêu cầu chữ ký `signature`.\n\nScope bắt buộc: `tradingws:order:put`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0002\",\n  \"method\": \"order.amend\",\n  \"params\": {\n    \"orderId\": \"ORD123456\",\n    \"accountNo\": \"0901351\",\n    \"price\": \"46.00\",\n    \"quantity\": 500,\n    \"deviceId\": \"MAC-AABBCCDDEEFF\"\n  },\n  \"signature\": \"base64(RSA-SHA256(...))\",\n  \"timestamp\": 1755000001000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/orderAmendResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/orderAmendRequest"

  tradingApiOrderCancel:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "order.cancel"
    description: "# order.cancel\n\nHủy lệnh hiện có. Xác định lệnh cần hủy qua `orderId` HOẶC `clientRequestId` (bắt buộc truyền đúng một trong hai). Cùng luồng ack nhanh `PD` như `order.place`. Yêu cầu chữ ký `signature`.\n\nScope bắt buộc: `tradingws:order:delete`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0003\",\n  \"method\": \"order.cancel\",\n  \"params\": {\n    \"orderId\": \"ORD123456\",\n    \"accountNo\": \"0901351\",\n    \"deviceId\": \"MAC-AABBCCDDEEFF\"\n  },\n  \"signature\": \"base64(RSA-SHA256(...))\",\n  \"timestamp\": 1755000002000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/orderCancelResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/orderCancelRequest"

  tradingApiFcoPlace:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "fco.place"
    description: "# fco.place\n\nĐặt lệnh điều kiện (Conditional Order) — response trả về ngay kết quả tạo lệnh, không theo luồng xác nhận nhanh như `order.*`. Nếu bị từ chối, response trả về lỗi kèm `error.code: \"FCO_ERROR\"`. Yêu cầu chữ ký `signature`. Tham khảo thêm [Tham khảo đặt lệnh điều kiện](https://developers.ssi.com.vn/docs/api-reference/appendix/fco-reference).\n\nScope bắt buộc: `tradingws:fco:post`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0004\",\n  \"method\": \"fco.place\",\n  \"params\": {\n    \"symbol\": \"SSI\",\n    \"side\": \"B\",\n    \"type\": \"TS\",\n    \"price\": \"45.00\",\n    \"quantity\": 4000,\n    \"accountNo\": \"1231496\",\n    \"deviceId\": \"MAC-AABBCCDDEEFF\"\n  },\n  \"signature\": \"base64(RSA-SHA256(...))\",\n  \"timestamp\": 1755000003000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/fcoPlaceResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/fcoPlaceRequest"

  tradingApiFcoCancel:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "fco.cancel"
    description: "# fco.cancel\n\nHủy lệnh điều kiện theo `fcoId`. Nếu bị từ chối, response trả về `error.code: \"FCO_ERROR\"`. Yêu cầu chữ ký `signature`.\n\nScope bắt buộc: `tradingws:fco:delete`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0005\",\n  \"method\": \"fco.cancel\",\n  \"params\": {\n    \"fcoId\": \"7528ac20-a340-4233-8bb7-a2379fc3c638\"\n  },\n  \"signature\": \"base64(RSA-SHA256(...))\",\n  \"timestamp\": 1755000004000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/fcoCancelResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/fcoCancelRequest"

  tradingApiFcoOrderbook:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "fco.orderbook"
    description: "# fco.orderbook\n\nLấy danh sách lệnh thường được sinh ra từ một lệnh điều kiện (`fcoId`), có phân trang. Không yêu cầu chữ ký.\n\nScope bắt buộc: `tradingws:fco:get`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0006\",\n  \"method\": \"fco.orderbook\",\n  \"params\": {\n    \"fcoId\": \"7528ac20-a340-4233-8bb7-a2379fc3c638\",\n    \"pageIndex\": 1,\n    \"pageSize\": 10\n  },\n  \"timestamp\": 1755000005000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/fcoOrderbookResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/fcoOrderbookRequest"

  tradingApiFcoList:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "fco.list"
    description: "# fco.list\n\nLấy danh sách lệnh điều kiện theo tài khoản và bộ lọc, có phân trang. Không yêu cầu chữ ký.\n\nScope bắt buộc: `tradingws:fco:get`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0007\",\n  \"method\": \"fco.list\",\n  \"params\": {\n    \"accountNo\": \"1231496\",\n    \"pageIndex\": 1,\n    \"pageSize\": 10\n  },\n  \"timestamp\": 1755000006000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/fcoListResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/fcoListRequest"

  tradingApiFcoStatusHistory:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "fco.statusHistory"
    description: "# fco.statusHistory\n\nLấy lịch sử thay đổi trạng thái của một lệnh điều kiện (`fcoId`). Không yêu cầu chữ ký. Nếu bị lỗi HOẶC danh sách lịch sử rỗng, response trả về `error.code: \"FCO_ERROR\"` (khác với `fco.orderbook`/`fco.list`, vốn coi danh sách rỗng vẫn là thành công).\n\nScope bắt buộc: `tradingws:fco:get`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0008\",\n  \"method\": \"fco.statusHistory\",\n  \"params\": {\n    \"fcoId\": \"7528ac20-a340-4233-8bb7-a2379fc3c638\"\n  },\n  \"timestamp\": 1755000007000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/fcoStatusHistoryResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/fcoStatusHistoryRequest"

  tradingApiQueryPosition:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "query.position"
    description: "# query.position\n\nLấy thông tin vị thế cho tài khoản. Tài khoản cổ phiếu trả về `equity`, tài khoản phái sinh trả về `derivative`. Không yêu cầu chữ ký.\n\nScope bắt buộc: `tradingws:position:get`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0009\",\n  \"method\": \"query.position\",\n  \"params\": {\n    \"accountNo\": \"0901351\",\n    \"querySummary\": true\n  },\n  \"timestamp\": 1755000008000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/queryPositionResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/queryPositionRequest"

  tradingApiQueryMaxBuySell:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "query.maxBuySell"
    description: "# query.maxBuySell\n\nLấy khối lượng mua/bán tối đa theo tài khoản, mã và giá. Không yêu cầu chữ ký.\n\nScope bắt buộc: `tradingws:maxBuySell:get`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0010\",\n  \"method\": \"query.maxBuySell\",\n  \"params\": {\n    \"accountNo\": \"0901351\",\n    \"symbol\": \"SSI\",\n    \"price\": 45.5\n  },\n  \"timestamp\": 1755000009000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/queryMaxBuySellResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/queryMaxBuySellRequest"

  tradingApiQueryAccountBalance:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "query.accountBalance"
    description: "# query.accountBalance\n\nLấy số dư tài khoản giao dịch. Không yêu cầu chữ ký.\n\nScope bắt buộc: `tradingws:accountBalance:get`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0011\",\n  \"method\": \"query.accountBalance\",\n  \"params\": {\n    \"accountNo\": \"0901351\"\n  },\n  \"timestamp\": 1755000010000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/queryAccountBalanceResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/queryAccountBalanceRequest"

  tradingApiQueryPpmmrAccount:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "query.ppmmrAccount"
    description: "# query.ppmmrAccount\n\nLấy thông tin PP/MMR (Purchasing Power/Maintenance Margin Ratio) của tài khoản. Không yêu cầu chữ ký.\n\nScope bắt buộc: `tradingws:ppmmrAccount:get`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0012\",\n  \"method\": \"query.ppmmrAccount\",\n  \"params\": {\n    \"accountNo\": \"0901351\"\n  },\n  \"timestamp\": 1755000011000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/queryPpmmrAccountResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/queryPpmmrAccountRequest"

  tradingApiQueryOrderBook:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "query.orderBook"
    description: "# query.orderBook\n\nLấy lịch sử sổ lệnh theo tài khoản và bộ lọc, có phân trang. Không yêu cầu chữ ký.\n\nScope bắt buộc: `tradingws:orderBook:get`.\n\nSample Request\n\n```\nwscat -c wss://api.ssi.com.vn/ws/v3/trading -x '{\n  \"id\": \"req-0013\",\n  \"method\": \"query.orderBook\",\n  \"params\": {\n    \"accountNo\": \"0901351\",\n    \"from\": \"2026/09/01\",\n    \"to\": \"2026/09/10\",\n    \"pageIndex\": 1,\n    \"pageSize\": 10\n  },\n  \"timestamp\": 1755000012000\n}'\n```"
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/queryOrderBookResponse"
    messages:
      - $ref: "#/channels/tradingApi/messages/queryOrderBookRequest"

  tradingApiSubscribe:
    action: send
    channel:
      $ref: "#/channels/tradingApi"
    title: "subscribe/unsubscribe"
    description: "Dùng `SUBSCRIBE`/`UNSUBSCRIBE` trên `TRADING` để nhận cập nhật lệnh sau ack `PD`. Không cần chữ ký hoặc `id`; topic phải chỉ rõ tài khoản thuộc API Key, không hỗ trợ wildcard. `portfolio` chỉ dành cho tài khoản phái sinh đuôi 8."
    reply:
      channel:
        $ref: "#/channels/tradingApi"
      messages:
        - $ref: "#/channels/tradingApi/messages/tradingApiSubscriptionAck"
    messages:
      - $ref: "#/channels/tradingApi/messages/tradingApiSubscribeRequest"
      - $ref: "#/channels/tradingApi/messages/tradingApiUnsubscribeRequest"

  tradingApiReceiveNotification:
    action: receive
    channel:
      $ref: "#/channels/tradingApi"
    title: "Thông báo order/portfolio"
    description: "Cấu trúc dữ liệu thông báo giống với channel `TRADING` của FastConnect WebSocket API (dữ liệu thị trường) — xem chi tiết field tại [Sub/Unsub Trading Data](https://developers.ssi.com.vn/docs/api-reference/subscribeUnsubscribeTradingData).\n\nVí dụ thông báo (`order.{accountNo}`):\n\n```json\n{ \"channel\": \"TRADING\", \"topic\": \"order.0901351\", \"data\": { \"eventType\": \"orderEvent\", \"clientRequestId\": \"req-0001\", \"orderId\": \"ORD123456\", \"orderStatus\": \"FF\", \"...\": \"...\" } }\n```"
    messages:
      - $ref: "#/channels/tradingApi/messages/tradingApiNotification"

  tradingApiReceiveError:
    action: receive
    channel:
      $ref: "#/channels/tradingApi"
    title: "Response lỗi (default)"
    description: "Response lỗi chung của WebSocket API. Với `fco.place`, `fco.cancel` và `fco.statusHistory`, response lỗi mang `error.code: \"FCO_ERROR\"`."
    messages:
      - $ref: "#/channels/tradingApi/messages/tradingApiErrorResponse"

components:
  messages:
    SubscribeRequest:
      name: SubscribeRequest
      title: "Subscribe topic"
      contentType: application/json
      description: "## Subscribe topic\n\n```json\n{\n  \"method\": \"SUBSCRIBE\",\n  \"channel\": \"DATA|TRADING\",\n  \"topics\": [\"trade.SSI@tick\", \"quote.SSI@tick\", \"order.0901351\"]\n}\n```"
      payload:
        $ref: "#/components/schemas/SubscribeRequest"

    UnsubscribeRequest:
      name: UnsubscribeRequest
      title: "Unsubscribe topic"
      contentType: application/json
      description: "## Unsubscribe topic\n\n```json\n{\n  \"method\": \"UNSUBSCRIBE\",\n  \"channel\": \"DATA|TRADING\",\n  \"topics\": [\"trade.SSI@tick\", \"order.0901351\"]\n}\n```"
      payload:
        $ref: "#/components/schemas/UnsubscribeRequest"

    ListSubscriptionRequest:
      name: ListSubscriptionRequest
      title: "Liệt kê subscription hiện tại"
      contentType: application/json
      description: "## Liệt kê subscription hiện tại\n\n```json\n{\n  \"method\": \"LIST_SUBSCRIPTION\"\n}\n```"
      payload:
        $ref: "#/components/schemas/ListSubscriptionRequest"

    ListSubscriptionResponse:
      name: ListSubscriptionResponse
      title: "LIST_SUBSCRIPTION response"
      contentType: application/json
      description: "Response trả về scope theo nhóm trading/data."
      payload:
        $ref: "#/components/schemas/ListSubscriptionResponse"

    Ping:
      name: Ping
      title: "Ping từ server"
      contentType: application/json
      description: "## Ping từ server\n\n```json\n{\n  \"method\": \"PING\",\n  \"channel\": \"HEARTBEAT\",\n  \"time\": \"dd-mm-yyyy hh-mm-ss\"\n}\n```"
      payload:
        $ref: "#/components/schemas/Ping"

    Pong:
      name: Pong
      title: "Pong từ client"
      contentType: application/json
      description: "## Pong từ client\n\n```json\n{\n  \"method\": \"PONG\",\n  \"channel\": \"HEARTBEAT\",\n  \"time\": \"dd-mm-yyyy hh-mm-ss\"\n}\n```"
      payload:
        $ref: "#/components/schemas/Pong"

    OrderEvent:
      name: OrderEvent
      title: "Order Event"
      contentType: application/json
      description: "### Order Event\n\nSự kiện trạng thái lệnh — phát sinh khi lệnh được đặt, sửa, hủy hoặc thay đổi trạng thái."
      payload:
        $ref: "#/components/schemas/OrderEvent"

    OrderMatchEvent:
      name: OrderMatchEvent
      title: "Order Match Event"
      contentType: application/json
      description: "### Order Match Event\n\nSự kiện khớp lệnh — phát sinh khi lệnh được khớp (một phần hoặc toàn bộ)."
      payload:
        $ref: "#/components/schemas/OrderMatchEvent"

    ClientPortfolioEvent:
      name: ClientPortfolioEvent
      title: "Client Portfolio Event"
      contentType: application/json
      description: "### Client Portfolio Event\n\nSự kiện cập nhật danh mục — phát sinh khi số dư hoặc tài sản thay đổi."
      payload:
        $ref: "#/components/schemas/ClientPortfolioEvent"

    FcoEvent:
      name: FcoEvent
      title: "FCO Event (Lệnh điều kiện)"
      contentType: application/json
      description: "FCO event phát sinh khi lệnh điều kiện thay đổi trạng thái; được gửi trên kênh `order` qua binding `onClientPortfolioEvent`."
      payload:
        $ref: "#/components/schemas/FcoEvent"

    TradeEvent:
      name: TradeEvent
      title: "Trade — thông tin khớp lệnh"
      contentType: application/json
      description: "## I. Trade — thông tin khớp lệnh"
      payload:
        $ref: "#/components/schemas/TradeEvent"

    QuoteEvent:
      name: QuoteEvent
      title: "Quote — thông tin bid/ask"
      contentType: application/json
      description: "## III. Quote — thông tin bid/ask"
      payload:
        $ref: "#/components/schemas/QuoteEvent"

    RoomEvent:
      name: RoomEvent
      title: "Room — thông tin room ngoại"
      contentType: application/json
      description: "## II. Room — thông tin room ngoại"
      payload:
        $ref: "#/components/schemas/RoomEvent"

    PutEvent:
      name: PutEvent
      title: "Put — khớp lệnh thỏa thuận"
      contentType: application/json
      description: "## IV. Put — khớp lệnh thỏa thuận"
      payload:
        $ref: "#/components/schemas/PutEvent"

    OddlotEvent:
      name: OddlotEvent
      title: "Oddlot — giao dịch lô lẻ"
      contentType: application/json
      description: "## V. Oddlot — giao dịch lô lẻ"
      payload:
        $ref: "#/components/schemas/OddlotEvent"

    MarketEvent:
      name: MarketEvent
      title: "Market — thông tin đầu ngày và phiên"
      contentType: application/json
      description: "## VI. Market — thông tin đầu ngày và phiên\n\nCú pháp subscribe không có interval: `market.[index/exchange/symbol-symbol/*]`.\n\nMarket streaming data:"
      payload:
        $ref: "#/components/schemas/MarketEvent"

    MarketFlagEvent:
      name: MarketFlagEvent
      title: "Market flag (message cờ phiên)"
      contentType: application/json
      description: "Market flag (message cờ phiên):"
      payload:
        $ref: "#/components/schemas/MarketFlagEvent"

    TradingApiConnectionRejectMessage:
      name: TradingApiConnectionRejectMessage
      title: "Message từ chối kết nối"
      contentType: application/json
      description: "Ví dụ message từ chối:\n\n```json\n{ \"code\": 401, \"msg\": \"Invalid or expired token\" }\n```\n\nCác lý do từ chối có thể gặp: `401` token thiếu/sai/hết hạn/bị thu hồi, `403` thiếu quyền `tradingws:*:*`, `429` vượt giới hạn kết nối đồng thời, `500` lỗi hệ thống."
      payload:
        $ref: "#/components/schemas/TradingApiConnectionRejectMessage"

    TradingApiPingPongRequest:
      name: TradingApiPingPongRequest
      title: "ping_pong — client gửi ping"
      contentType: application/json
      description: "Client gửi ping:\n\n```json\n{ \"method\": \"ping_pong\" }\n```\n\nMessage này không cần chữ ký và không mang `id`."
      payload:
        $ref: "#/components/schemas/TradingApiPingPongRequest"

    TradingApiPingPongResponse:
      name: TradingApiPingPongResponse
      title: "ping_pong — server trả pong"
      contentType: application/json
      description: "Server trả pong:\n\n```json\n{ \"method\": \"ping_pong\", \"channel\": \"HEARTBEAT\", \"status\": \"ok\", \"message\": \"pong\" }\n```"
      payload:
        $ref: "#/components/schemas/TradingApiPingPongResponse"

    OrderPlaceRequest:
      name: OrderPlaceRequest
      title: "order.place request"
      contentType: application/json
      correlationId:
        description: "`id` — Định danh do client tự sinh để đối chiếu response."
        location: "$message.payload#/id"
      description: "Đặt lệnh mới. Hệ thống phản hồi ngay (`orderStatus: \"PD\"`) để xác nhận đã nhận lệnh — trạng thái khớp lệnh thật sẽ đến sau qua kênh thông báo `order.{accountNo}`. Yêu cầu chữ ký `signature` (RSA+SHA256) theo quy định UBCKNN về toàn vẹn dữ liệu giao dịch.\n\nScope bắt buộc: `tradingws:order:post`."
      payload:
        $ref: "#/components/schemas/OrderPlaceRequest"

    OrderPlaceResponse:
      name: OrderPlaceResponse
      title: "order.place response (200)"
      contentType: application/json
      correlationId:
        description: "`id` — trả lại đúng `id` của request."
        location: "$message.payload#/id"
      description: "Sample Response\n\n```json\n{\n  \"id\": \"req-0001\",\n  \"method\": \"order.place\",\n  \"status\": 200,\n  \"result\": {\n    \"clientRequestId\": \"req-0001\",\n    \"orderStatus\": \"PD\"\n  },\n  \"rateLimit\": {\n    \"limit\": 50,\n    \"remaining\": 47,\n    \"resetMs\": 900\n  }\n}\n```"
      payload:
        $ref: "#/components/schemas/OrderPlaceResponse"

    OrderAmendRequest:
      name: OrderAmendRequest
      title: "order.amend request"
      contentType: application/json
      correlationId:
        description: "`id` — Định danh do client tự sinh để đối chiếu response."
        location: "$message.payload#/id"
      description: "Sửa lệnh hiện có. Xác định lệnh cần sửa qua `orderId` HOẶC `clientRequestId` (bắt buộc truyền đúng một trong hai — truyền cả hai hoặc không truyền gì đều bị từ chối). Cùng luồng ack nhanh `PD` như `order.place`. Yêu cầu chữ ký `signature`.\n\nScope bắt buộc: `tradingws:order:put`."
      payload:
        $ref: "#/components/schemas/OrderAmendRequest"

    OrderAmendResponse:
      name: OrderAmendResponse
      title: "order.amend response (200)"
      contentType: application/json
      correlationId:
        description: "`id` — trả lại đúng `id` của request."
        location: "$message.payload#/id"
      description: "Sample Response\n\n```json\n{\n  \"id\": \"req-0002\",\n  \"method\": \"order.amend\",\n  \"status\": 200,\n  \"result\": {\n    \"clientRequestId\": \"req-0001\",\n    \"orderId\": \"ORD123456\",\n    \"orderStatus\": \"PD\",\n    \"clientModifyId\": \"req-0002\"\n  },\n  \"rateLimit\": {\n    \"limit\": 50,\n    \"remaining\": 46,\n    \"resetMs\": 880\n  }\n}\n```"
      payload:
        $ref: "#/components/schemas/OrderAmendResponse"

    OrderCancelRequest:
      name: OrderCancelRequest
      title: "order.cancel request"
      contentType: application/json
      correlationId:
        description: "`id` — Định danh do client tự sinh để đối chiếu response."
        location: "$message.payload#/id"
      description: "Hủy lệnh hiện có. Xác định lệnh cần hủy qua `orderId` HOẶC `clientRequestId` (bắt buộc truyền đúng một trong hai). Cùng luồng ack nhanh `PD` như `order.place`. Yêu cầu chữ ký `signature`.\n\nScope bắt buộc: `tradingws:order:delete`."
      payload:
        $ref: "#/components/schemas/OrderCancelRequest"

    OrderCancelResponse:
      name: OrderCancelResponse
      title: "order.cancel response (200)"
      contentType: application/json
      correlationId:
        description: "`id` — trả lại đúng `id` của request."
        location: "$message.payload#/id"
      description: "Sample Response\n\n```json\n{\n  \"id\": \"req-0003\",\n  \"method\": \"order.cancel\",\n  \"status\": 200,\n  \"result\": {\n    \"clientRequestId\": \"req-0001\",\n    \"orderId\": \"ORD123456\",\n    \"orderStatus\": \"PD\",\n    \"clientCancelId\": \"req-0003\"\n  },\n  \"rateLimit\": {\n    \"limit\": 50,\n    \"remaining\": 45,\n    \"resetMs\": 860\n  }\n}\n```"
      payload:
        $ref: "#/components/schemas/OrderCancelResponse"

    FcoPlaceRequest:
      name: FcoPlaceRequest
      title: "fco.place request"
      contentType: application/json
      correlationId:
        description: "`id` — Định danh do client tự sinh để đối chiếu response."
        location: "$message.payload#/id"
      description: "Đặt lệnh điều kiện (Conditional Order) — response trả về ngay kết quả tạo lệnh, không theo luồng xác nhận nhanh như `order.*`. Nếu bị từ chối, response trả về lỗi kèm `error.code: \"FCO_ERROR\"`. Yêu cầu chữ ký `signature`.\n\nScope bắt buộc: `tradingws:fco:post`."
      payload:
        $ref: "#/components/schemas/FcoPlaceRequest"

    FcoPlaceResponse:
      name: FcoPlaceResponse
      title: "fco.place response (200)"
      contentType: application/json
      correlationId:
        description: "`id` — trả lại đúng `id` của request."
        location: "$message.payload#/id"
      description: "Sample Response\n\n```json\n{\n  \"id\": \"req-0004\",\n  \"method\": \"fco.place\",\n  \"status\": 200,\n  \"result\": {\n    \"fcoId\": \"7528ac20-a340-4233-8bb7-a2379fc3c638\"\n  },\n  \"rateLimit\": {\n    \"limit\": 50,\n    \"remaining\": 44,\n    \"resetMs\": 840\n  }\n}\n```"
      payload:
        $ref: "#/components/schemas/FcoPlaceResponse"

    FcoCancelRequest:
      name: FcoCancelRequest
      title: "fco.cancel request"
      contentType: application/json
      correlationId:
        description: "`id` — Định danh do client tự sinh để đối chiếu response."
        location: "$message.payload#/id"
      description: "Hủy lệnh điều kiện theo `fcoId`. Nếu bị từ chối, response trả về `error.code: \"FCO_ERROR\"`. Yêu cầu chữ ký `signature`.\n\nScope bắt buộc: `tradingws:fco:delete`."
      payload:
        $ref: "#/components/schemas/FcoCancelRequest"

    FcoCancelResponse:
      name: FcoCancelResponse
      title: "fco.cancel response (200)"
      contentType: application/json
      correlationId:
        description: "`id` — trả lại đúng `id` của request."
        location: "$message.payload#/id"
      description: "Sample Response\n\n```json\n{\n  \"id\": \"req-0005\",\n  \"method\": \"fco.cancel\",\n  \"status\": 200,\n  \"result\": {\n    \"fcoId\": \"7528ac20-a340-4233-8bb7-a2379fc3c638\",\n    \"username\": \"123149\"\n  },\n  \"rateLimit\": {\n    \"limit\": 50,\n    \"remaining\": 43,\n    \"resetMs\": 820\n  }\n}\n```"
      payload:
        $ref: "#/components/schemas/FcoCancelResponse"

    FcoOrderbookRequest:
      name: FcoOrderbookRequest
      title: "fco.orderbook request"
      contentType: application/json
      correlationId:
        description: "`id` — Định danh do client tự sinh để đối chiếu response."
        location: "$message.payload#/id"
      description: "Lấy danh sách lệnh thường được sinh ra từ một lệnh điều kiện (`fcoId`), có phân trang. Không yêu cầu chữ ký.\n\nScope bắt buộc: `tradingws:fco:get`."
      payload:
        $ref: "#/components/schemas/FcoOrderbookRequest"

    FcoOrderbookResponse:
      name: FcoOrderbookResponse
      title: "fco.orderbook response (200)"
      contentType: application/json
      correlationId:
        description: "`id` — trả lại đúng `id` của request."
        location: "$message.payload#/id"
